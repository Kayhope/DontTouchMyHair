<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book an Appointment - Don't Touch My Hair</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="nav.css">
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body class="bg-light">
    <nav class="site-nav">
        <div class="nav-brand"><a href="index.html">Don't Touch My Hair</a></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="booking.html" class="active">Book</a></li>
            <li><a href="buy.html">Buy Hair Oil</a></li>
        </ul>
    </nav>

    <div class="container py-5">
        <div class="card shadow-lg p-5 booking-card animate-fade-in">
            <div class="text-center mb-4">
                <img src="Logo%20.jpg" alt="Don't Touch My Hair Logo" class="logo-img">
            </div>

            <h2 class="text-center text-gradient mb-4">Book Your Appointment</h2>
            <p class="text-center text-muted mb-4">Transform your look with our expert hair braiding and styling services.</p>

            <div id="formStatus" class="alert d-none" role="alert"></div>

            <form id="bookingForm">
                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" id="phone" name="phone" required>
                </div>

                <div class="mb-3">
                    <label for="service" class="form-label">Service</label>
                    <select id="service" name="service" class="form-select" required>
                        <option value="" disabled selected>Select Service</option>
                        <option value="Braiding">Braiding</option>
                        <option value="Hair Treatment">Hair Treatment</option>
                        <option value="Hair Oil Consultation">Hair Oil Consultation</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="styleImage" class="form-label">Upload Style Image (Optional)</label>
                    <input type="file" class="form-control" id="styleImage" name="styleImage" accept="image/*">
                    <small class="form-text text-muted">Shown on the admin page while this browser tab stays open.</small>
                </div>

                <div class="mb-3">
                    <label class="form-label d-block">Will you bring your own hairpieces?</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="bringHairpieces" id="bringHairpiecesYes" value="Yes" required>
                        <label class="form-check-label" for="bringHairpiecesYes">Yes</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="bringHairpieces" id="bringHairpiecesNo" value="No">
                        <label class="form-check-label" for="bringHairpiecesNo">No</label>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="date" class="form-label">Appointment Date</label>
                    <input type="date" class="form-control" id="date" name="date" required>
                </div>

                <div class="mb-3">
                    <label for="time" class="form-label">Appointment Time</label>
                    <input type="time" class="form-control" id="time" name="time" required>
                </div>

                <div class="mb-3">
                    <label for="message" class="form-label">Additional Message (Optional)</label>
                    <textarea class="form-control" id="message" name="message" rows="3" maxlength="250"></textarea>
                    <small id="charCounter" class="form-text text-muted">0/250 characters</small>
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-3 btn-gradient animate-hover" id="submitBtn">Submit</button>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        const form = document.getElementById('bookingForm');
        const statusBox = document.getElementById('formStatus');
        const submitBtn = document.getElementById('submitBtn');

        function showStatus(message, type) {
            statusBox.textContent = message;
            statusBox.className = `alert alert-${type}`;
        }

        function getBookings() {
            try {
                return JSON.parse(localStorage.getItem('dtmh_bookings')) || [];
            } catch (e) {
                return [];
            }
        }

        function readFileAsDataUrl(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        form.addEventListener('submit', async function (event) {
            event.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            try {
                const fileInput = document.getElementById('styleImage');
                let styleImage = null;

                if (fileInput.files[0]) {
                    if (fileInput.files[0].size > 1_500_000) {
                        showStatus('That style image is too large for this no-server version (max ~1.5MB). Your booking will still be saved without it.', 'warning');
                    } else {
                        styleImage = await readFileAsDataUrl(fileInput.files[0]);
                    }
                }

                const bookingData = {
                    id: Date.now(),
                    name: document.getElementById('name').value,
                    email: document.getElementById('email').value,
                    phone: document.getElementById('phone').value,
                    service: document.getElementById('service').value,
                    styleImage: styleImage,
                    bringHairpieces: document.querySelector('input[name="bringHairpieces"]:checked').value,
                    date: document.getElementById('date').value,
                    time: document.getElementById('time').value,
                    message: document.getElementById('message').value,
                    status: 'Pending',
                    createdAt: new Date().toISOString()
                };

                const bookings = getBookings();
                bookings.push(bookingData);
                localStorage.setItem('dtmh_bookings', JSON.stringify(bookings));

                showStatus('Your appointment has been booked! We\'ll be in touch to confirm.', 'success');
                form.reset();
                document.getElementById('charCounter').textContent = '0/250 characters';
            } catch (err) {
                showStatus('Something went wrong saving your booking. Please try again.', 'danger');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit';
            }
        });
    </script>
</body>
</html>
