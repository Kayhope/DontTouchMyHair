<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Send private feedback directly to the Don't Touch My Hair salon team.">
    <title>Private Feedback - Don't Touch My Hair</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="nav.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="site-nav">
        <div class="nav-brand"><a href="index.html" aria-label="Don't Touch My Hair home"><img src="logotam.jpeg" alt="" class="brand-logo"><span class="brand-copy"><strong>Don't Touch My Hair</strong><small>Hair salon · Natural care</small></span></a></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="booking.html">Book</a></li>
            <li><a href="buy.html">Buy Hair Oil</a></li>
            <li><a href="feedback.html" class="active">Feedback</a></li>
        </ul>
    </nav>

    <main class="page-shell">
        <section class="admin-panel feedback-panel">
            <p class="eyebrow">We'd love to hear from you</p>
            <h1 id="feedbackHeading">Share private feedback</h1>
            <p id="feedbackIntro">Your feedback goes directly to the salon and is not published on the website.</p>
            <div id="feedbackStatus" class="alert d-none" role="status" aria-live="polite"></div>
            <form id="feedbackForm">
                <input type="hidden" name="feedbackType" id="feedbackType" value="Website">
                <input type="hidden" name="token" id="feedbackToken">

                <div class="mb-3">
                    <label class="form-label" for="feedbackName">Name (optional)</label>
                    <input class="form-control" type="text" id="feedbackName" name="name" maxlength="100">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="feedbackEmail">Email (optional)</label>
                    <input class="form-control" type="email" id="feedbackEmail" name="email">
                </div>
                <div class="mb-3" id="ratingField" hidden>
                    <label class="form-label" for="rating">How was your appointment?</label>
                    <select class="form-select" id="rating" name="rating">
                        <option value="">Choose a rating</option>
                        <option value="5">Excellent — 5</option>
                        <option value="4">Very good — 4</option>
                        <option value="3">Good — 3</option>
                        <option value="2">Could be better — 2</option>
                        <option value="1">Poor — 1</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="feedbackMessage">Your feedback</label>
                    <textarea class="form-control" id="feedbackMessage" name="message" rows="5" minlength="5" maxlength="2000" required></textarea>
                </div>
                <button class="btn btn-primary" type="submit" id="feedbackSubmit">Send feedback privately</button>
            </form>
        </section>
    </main>

    <script>
        const feedbackForm = document.getElementById('feedbackForm');
        const feedbackStatus = document.getElementById('feedbackStatus');
        const token = new URLSearchParams(window.location.search).get('token') || '';
        const isAppointmentFeedback = /^[a-f0-9]{64}$/.test(token);

        if (isAppointmentFeedback) {
            document.getElementById('feedbackType').value = 'Appointment';
            document.getElementById('feedbackToken').value = token;
            document.getElementById('ratingField').hidden = false;
            document.getElementById('rating').required = true;
            document.getElementById('feedbackHeading').textContent = 'How was your appointment?';
            document.getElementById('feedbackIntro').textContent = 'Thank you for visiting. Your feedback is private and will only be sent to the salon.';
        }

        feedbackForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const button = document.getElementById('feedbackSubmit');
            button.disabled = true;
            button.textContent = 'Sending...';
            try {
                const response = await fetch('submit_feedback.php', {
                    method: 'POST',
                    body: new FormData(feedbackForm),
                });
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.message || 'We could not send your feedback.');
                }
                feedbackStatus.textContent = result.message;
                feedbackStatus.className = `alert ${result.emailSent ? 'alert-success' : 'alert-warning'}`;
                feedbackForm.reset();
            } catch (error) {
                feedbackStatus.textContent = error.message;
                feedbackStatus.className = 'alert alert-danger';
            } finally {
                button.disabled = false;
                button.textContent = 'Send feedback privately';
            }
        });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
